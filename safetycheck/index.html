<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安否確認</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --primary: #16a34a;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --warning: #fff7ed;
      --warning-text: #9a4d00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 16px 36px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.05);
      padding: 22px 18px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.4;
    }
    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .form-group {
      margin-top: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f9fafb;
      padding: 14px 12px;
      font-size: 16px;
      color: var(--text);
    }
    input:focus, select:focus {
      outline: 2px solid rgba(22, 163, 74, 0.2);
      border-color: var(--primary);
      background: #fff;
    }
    .btn {
      width: 100%;
      margin-top: 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #15803d);
      color: white;
      font-size: 16px;
      font-weight: 800;
      padding: 16px 12px;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(22, 163, 74, 0.18);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .status {
      margin-top: 14px;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .alert {
      margin-top: 16px;
      background: var(--warning);
      color: var(--warning-text);
      border: 1px solid #fdba74;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }
    .alert.show {
      display: block;
    }
    .inline-row {
      display: flex;
      gap: 12px;
    }
    .inline-row > div {
      flex: 1;
    }
    .debug-banner {
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .debug-banner.visible {
      display: block;
    }
    .debug-panel {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      display: none;
    }
    .debug-panel.visible {
      display: block;
    }
    .debug-panel__title {
      margin: 0 0 8px;
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
    }
    .debug-panel__text {
      margin: 0 0 12px;
      color: #475569;
      font-size: 12px;
      line-height: 1.6;
    }
    .debug-panel__actions {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .debug-panel__actions input {
      flex: 1;
      margin-top: 0;
      font-size: 14px;
      padding: 11px 12px;
    }
    .debug-panel__actions button {
      width: auto;
      min-width: 108px;
      margin-top: 0;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="eyebrow">安否確認</div>
      <h1 id="survey-title">安否確認</h1>
      <p class="subtitle">現在の安否状態をお知らせください。</p>

      <div id="register-panel" style="display:none;">
        <div class="form-group">
          <label for="register_name">氏名</label>
          <input id="register_name" type="text" placeholder="例: 山田 太郎" />
        </div>
        <div class="form-group">
          <label for="register_group">班</label>
          <select id="register_group">
            <option value="">選択してください</option>
            <option value="1">1班</option>
            <option value="2">2班</option>
            <option value="3">3班</option>
            <option value="4">4班</option>
            <option value="5">5班</option>
            <option value="6">6班</option>
            <option value="7">7班</option>
            <option value="8">8班</option>
            <option value="9">9班</option>
            <option value="10">10班</option>
            <option value="11">11班</option>
            <option value="12">12班</option>
            <option value="13">13班</option>
            <option value="14">14班</option>
            <option value="15">15班</option>
          </select>
        </div>
        <button id="register-btn" class="btn" type="button">登録して続ける</button>
      </div>

      <div id="survey-panel" style="display:none;">
        <div class="form-group">
          <label>現在の状況</label>
          <div class="inline-row">
            <div>
              <label><input type="radio" name="answer" value="safe" /> 無事</label>
            </div>
            <div>
              <label><input type="radio" name="answer" value="needs_help" /> 連絡が必要</label>
            </div>
          </div>
          <div class="inline-row" style="margin-top: 10px;">
            <div>
              <label><input type="radio" name="answer" value="unknown" /> 不明</label>
            </div>
            <div>
              <label><input type="radio" name="answer" value="not_answered" /> 未回答</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="remarks">補足</label>
          <input id="remarks" type="text" placeholder="例: 連絡先や状況の補足" />
        </div>

        <button id="submit-btn" class="btn" type="button">安否を送信</button>
      </div>

      <div id="completed-panel" style="display:none;">
        <div class="alert show" style="display:block;">
          安否確認は受け付けました。ご協力ありがとうございました。
        </div>
      </div>

      <div id="debug-banner" class="debug-banner"></div>
      <div id="debug-panel" class="debug-panel">
        <div class="debug-panel__title">PC検証モード</div>
        <div class="debug-panel__text">ここに安否確認の sid を入れてください。入力後に検証用 URL へ切り替えます。</div>
        <div class="debug-panel__actions">
          <input id="debug-sid-input" type="text" placeholder="sc_20260905_172605_157ca7" />
          <button id="debug-start-btn" type="button">開始</button>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="../common/app-config.js"></script>
  <script>
    const PAGE_CONFIG = (window.AppConfig && window.AppConfig.getPageConfig('safetycheck')) || {};
    const GAS_API_URL = PAGE_CONFIG.gasUrl || "";
    const LIFF_ID = PAGE_CONFIG.liffId || "2008893549-jeCNKx4Y";
    const params = new URLSearchParams(window.location.search);

    function resolveSurveyIdFromUrl() {
      const directSid = params.get('sid');
      if (directSid) {
        return directSid;
      }

      const encodedState = params.get('liff.state');
      if (!encodedState) {
        return '';
      }

      try {
        const decoded = decodeURIComponent(encodedState);
        const stateParams = new URLSearchParams(decoded.startsWith('?') ? decoded.slice(1) : decoded);
        return stateParams.get('sid') || '';
      } catch (err) {
        console.warn('Failed to decode liff.state', err);
        return '';
      }
    }

    const surveyId = resolveSurveyIdFromUrl();
    const lineIdParam = params.get('line_id') || '';
    const isDebugMode = params.get('debug') === '1' || params.get('pc_debug') === '1';

    const registerPanel = document.getElementById('register-panel');
    const surveyPanel = document.getElementById('survey-panel');
    const completedPanel = document.getElementById('completed-panel');
    const debugBanner = document.getElementById('debug-banner');
    const debugPanel = document.getElementById('debug-panel');
    const debugSidInput = document.getElementById('debug-sid-input');
    const debugStartBtn = document.getElementById('debug-start-btn');
    const statusEl = document.getElementById('status');
    const surveyTitle = document.getElementById('survey-title');

    const state = {
      lineId: '',
      registered: false,
      surveyTitle: '安否確認'
    };

    function setStatus(text, isError) {
      statusEl.textContent = text || '';
      statusEl.style.color = isError ? '#dc2626' : '#6b7280';
    }

    function showPanel(name) {
      registerPanel.style.display = name === 'register' ? 'block' : 'none';
      surveyPanel.style.display = name === 'survey' ? 'block' : 'none';
      completedPanel.style.display = name === 'completed' ? 'block' : 'none';
    }

    function renderDebugBanner() {
      if (!debugBanner || !isLocalDebugMode()) {
        return;
      }

      const currentUrl = window.location.href;
      const lines = [
        'PC検証モード',
        'sid: ' + (surveyId || '(未設定)'),
        'line_id: ' + (lineIdParam || '(未設定)'),
        'URL: ' + currentUrl,
        '使い方: ?sid=...&debug=1&line_id=pc001 の形式で開いてください。'
      ];

      debugBanner.textContent = lines.join('\n');
      debugBanner.classList.add('visible');
    }

    function renderDebugPanel() {
      if (!debugPanel) {
        return;
      }

      if (!isLocalDebugMode()) {
        debugPanel.classList.remove('visible');
        return;
      }

      debugPanel.classList.add('visible');
      if (debugSidInput && !surveyId) {
        debugSidInput.focus();
      }
    }

    function openDebugSurvey() {
      const inputSid = debugSidInput ? debugSidInput.value.trim() : '';
      if (!inputSid) {
        setStatus('sid を入力してください。', true);
        return;
      }

      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set('sid', inputSid);
      nextParams.set('debug', '1');
      if (lineIdParam) {
        nextParams.set('line_id', lineIdParam);
      } else {
        nextParams.set('line_id', 'pc001');
      }
      window.location.search = nextParams.toString();
    }

    function formatErrorDetail(err) {
      if (!err) return '不明なエラー';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      try {
        return JSON.stringify(err);
      } catch (e) {
        return String(err);
      }
    }

    function isLocalDebugMode() {
      return window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || isDebugMode;
    }

    if (debugStartBtn) {
      debugStartBtn.addEventListener('click', openDebugSurvey);
    }

    function requestGasJsonp(params) {
      return new Promise((resolve, reject) => {
        if (!GAS_API_URL) {
          reject(new Error('GAS URL が未設定です。Script Properties の SURVEY_BASE_URL を確認してください。'));
          return;
        }

        const callbackName = `__safetyCheckJsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        const query = new URLSearchParams();

        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === '') {
            return;
          }
          query.set(key, String(value));
        });

        query.set('callback', callbackName);

        let timerId = null;

        const cleanup = () => {
          if (timerId) {
            clearTimeout(timerId);
            timerId = null;
          }
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
          try {
            delete window[callbackName];
          } catch (err) {
            window[callbackName] = undefined;
          }
        };

        window[callbackName] = (payload) => {
          cleanup();
          if (payload && payload.ok === false && payload.error) {
            const apiMessage = payload.error.message || 'GAS でエラーが発生しました。';
            const apiDetails = payload.error.details ? ' / 詳細: ' + payload.error.details : '';
            reject(new Error(apiMessage + apiDetails));
            return;
          }
          resolve(payload);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('GAS への通信に失敗しました。Web App URL が正しいか、LINEアプリ内で開いているか確認してください。'));
        };

        timerId = window.setTimeout(() => {
          cleanup();
          reject(new Error('GAS への通信がタイムアウトしました。Web App URL または GAS の公開設定を確認してください。'));
        }, 15000);

        script.src = `${GAS_API_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    async function init() {
      if (!GAS_API_URL) {
        setStatus('GAS URL が未設定です。Script Properties の SURVEY_BASE_URL を確認してください。', true);
        return;
      }

      if (!surveyId) {
        renderDebugPanel();
        setStatus('URL に sid が含まれていません。生成済みの安否確認 URL を開いてください。', true);
        return;
      }

      try {
        if (!window.liff) {
          throw new Error('LIFF SDK が読み込まれていません。LINE で開いてください。');
        }

        if (isLocalDebugMode()) {
          state.lineId = lineIdParam || 'local_debug_user';
        } else {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          state.lineId = profile.userId;
        }

        const data = await requestGasJsonp({
          action: 'safety_check',
          sid: surveyId,
          line_id: state.lineId
        });

        if (!data || data.status === 'error') {
          setStatus(data && data.message ? data.message : '安否確認の開始に失敗しました。', true);
          return;
        }

        surveyTitle.textContent = data.title || '安否確認';
        state.surveyTitle = data.title || '安否確認';
        state.user_name = data.user_name || '';
        state.group_name = data.group_name || '';

        if (data.is_registered) {
          state.registered = true;
          showPanel('survey');
          setStatus('登録済みユーザーです。安否をお知らせください。');
        } else {
          state.registered = false;
          showPanel('register');
          setStatus('まだ登録が未完了です。簡易登録を行ってください。');
        }
      } catch (err) {
        console.error('safetycheck init failed:', err);
        const message = err && err.message ? err.message : '不明なエラー';
        const userMessage = isLocalDebugMode()
          ? 'PC検証モードです。LIFF は使わず、GAS へ直接アクセスしています。\n' + message
          : '初期化に失敗しました。LINEアプリ内から開いてください。' + '\n' + message;
        setStatus(userMessage, true);
      }
    }

    document.getElementById('register-btn').addEventListener('click', async function () {
      const name = document.getElementById('register_name').value.trim();
      const group = document.getElementById('register_group').value;

      if (!name || !group) {
        setStatus('氏名と班を入力してください。', true);
        return;
      }

      setStatus('登録中...');
      try {
        const result = await requestGasJsonp({
          action: 'safety_check_register',
          survey_id: surveyId,
          line_id: state.lineId,
          name: name,
          group: group
        });

        if (!result || result.status !== 'success') {
          setStatus((result && result.message) || '登録に失敗しました。', true);
          return;
        }

        const redirectUrl = '/index.html?from_safety_check=1';
        window.location.href = redirectUrl;
      } catch (err) {
        const message = err && err.message ? err.message : '不明なエラー';
        setStatus('登録に失敗しました。' + message, true);
      }
    });

    document.getElementById('submit-btn').addEventListener('click', async function () {
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) {
        setStatus('現在の状況を選択してください。', true);
        return;
      }

      setStatus('送信中...');
      try {
        const result = await requestGasJsonp({
          action: 'safety_check_submit',
          survey_id: surveyId,
          line_id: state.lineId,
          answer_status: selected.value,
          remarks: document.getElementById('remarks').value.trim(),
          user_name: state.user_name || '',
          group_name: state.group_name || '',
          accessed_at: new Date().toISOString()
        });

        if (!result || result.status !== 'success') {
          setStatus((result && result.message) || '送信に失敗しました。', true);
          return;
        }

        showPanel('completed');
        setStatus('安否確認を送信しました。');
      } catch (err) {
        const message = err && err.message ? err.message : '不明なエラー';
        setStatus('送信に失敗しました。' + message, true);
      }
    });

    renderDebugBanner();
    renderDebugPanel();
    init();
  </script>
</body>
</html>
